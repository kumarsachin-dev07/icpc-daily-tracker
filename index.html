<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICPC + CSE Daily Tracker</title>
<style>
  :root {
    --bg: #0b0f1a;
    --card: #10182b;
    --border: rgba(255,255,255,0.08);
    --text: #e6edf3;
    --muted: #94a3b8;
    --blue: #38bdf8;
    --purple: #a855f7;
    --green: #22c55e;
    --yellow: #eab308;
    --orange: #f97316;
    --pink: #f43f5e;
    --grey: #64748b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-bottom: 60px;
  }
  .hero {
    background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 60%, #0b0f1a 100%);
    padding: 34px 24px 26px;
    position: sticky;
    top: 0;
    z-index: 10;
    border-bottom: 1px solid var(--border);
  }
  .hero h1 {
    margin: 0 0 4px 0;
    font-size: 24px;
    font-weight: 800;
    background: linear-gradient(90deg, #38bdf8, #a855f7, #f472b6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .hero p { margin: 0 0 16px 0; font-size: 13px; color: var(--muted); }
  .progress-wrap {
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
  }
  .progress-top {
    display: flex;
    justify-content: space-between;
    font-size: 12.5px;
    color: var(--muted);
    margin-bottom: 8px;
  }
  #progress-count { color: var(--blue); font-weight: 700; }
  #progress-pct { color: var(--purple); font-weight: 700; }
  .bar-outer {
    background: rgba(255,255,255,0.08);
    border-radius: 20px;
    height: 10px;
    overflow: hidden;
  }
  .bar-inner {
    height: 100%;
    background: linear-gradient(90deg, #38bdf8, #a855f7);
    width: 0%;
    transition: width 0.3s ease;
    border-radius: 20px;
  }
  .container { padding: 22px 18px; max-width: 720px; margin: 0 auto; }

  details.phase {
    margin-bottom: 16px;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid var(--border);
    background: var(--card);
  }
  details.phase[open] summary { border-bottom: 1px solid var(--border); }
  summary {
    padding: 14px 18px;
    font-size: 15px;
    font-weight: 700;
    color: #fff;
    cursor: pointer;
    list-style: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  summary::-webkit-details-marker { display: none; }
  .summary-left { display: flex; align-items: center; gap: 8px; }
  .summary-right {
    font-size: 11.5px;
    color: rgba(255,255,255,0.85);
    font-weight: 600;
    white-space: nowrap;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 2px;
  }
  .summary-right .sr-count { font-size: 10.5px; opacity: 0.85; }
  .chevron { transition: transform 0.2s; font-size: 12px; }
  details[open] .chevron { transform: rotate(90deg); }

  .p-neg1 summary { background: linear-gradient(90deg,#334155,#1e293b); }
  .p0 summary { background: linear-gradient(90deg,#0ea5e9,#0369a1); }
  .p1 summary { background: linear-gradient(90deg,#22c55e,#15803d); }
  .p2 summary { background: linear-gradient(90deg,#eab308,#a16207); }
  .p3 summary { background: linear-gradient(90deg,#f97316,#c2410c); }
  .p4 summary { background: linear-gradient(90deg,#a855f7,#6d28d9); }

  .phase-body { padding: 8px 10px; }

  .day-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 9px 10px;
    border-radius: 8px;
    margin-bottom: 2px;
    transition: background 0.15s ease;
  }
  .day-row:hover { background: rgba(255,255,255,0.05); }
  .day-row.weekend { background: rgba(56,189,248,0.04); }

  input[type=checkbox] {
    appearance: none;
    -webkit-appearance: none;
    width: 19px;
    height: 19px;
    min-width: 19px;
    border: 2px solid rgba(255,255,255,0.25);
    border-radius: 5px;
    margin-top: 2px;
    cursor: pointer;
    position: relative;
    background: rgba(255,255,255,0.03);
    transition: transform 0.12s ease;
  }
  input[type=checkbox]:active { transform: scale(0.88); }
  input[type=checkbox]:checked {
    background: linear-gradient(135deg,#38bdf8,#a855f7);
    border-color: transparent;
  }
  input[type=checkbox]:checked::after {
    content: "✓";
    position: absolute;
    top: -3px;
    left: 3px;
    font-size: 13px;
    color: #0b0f1a;
    font-weight: 900;
  }
  .day-label { display: flex; flex-direction: column; flex: 1; }
  .day-num { font-size: 10.5px; color: var(--blue); font-weight: 700; letter-spacing: 0.5px; }
  .day-num.weekend-tag { color: var(--pink); }
  .day-text { font-size: 13.5px; color: var(--text); line-height: 1.4; margin-top: 1px; }
  .day-row.done .day-text {
    text-decoration: line-through;
    text-decoration-color: var(--green);
    text-decoration-thickness: 2px;
    color: var(--muted);
  }
  .day-row.done .day-num { color: var(--green); }

  .top-actions {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }
  .btn {
    flex: 1;
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 10px;
    border-radius: 8px;
    font-size: 12px;
    cursor: pointer;
    text-align: center;
    transition: background 0.15s ease;
  }
  .btn:hover { background: rgba(255,255,255,0.12); }
  .btn:active { transform: scale(0.97); }
  .btn.danger { color: #fca5a5; }

  #status {
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    padding: 10px;
  }
</style>
</head>
<body>

<div class="hero">
  <h1>ICPC + CSE Daily Tracker</h1>
  <p>From Day 1 to Regionals prep — check off each day, progress saves automatically.</p>
  <div class="progress-wrap">
    <div class="progress-top">
      <span>Overall Progress</span>
      <span><span id="progress-count">0</span> / <span id="progress-total">0</span> days &nbsp;(<span id="progress-pct">0%</span>)</span>
    </div>
    <div class="bar-outer"><div class="bar-inner" id="bar"></div></div>
    <div class="top-actions">
      <div class="btn" id="expand-all">Expand all</div>
      <div class="btn" id="collapse-all">Collapse all</div>
      <div class="btn danger" id="reset-btn">Reset progress</div>
    </div>
  </div>
</div>

<div class="container" id="phases-container"></div>
<div id="status"></div>

<script>
// ---------- DATA MODEL ----------
// Each phase: id, label, cssClass, startDay, endDay, coreTasks (weekday sequence), fillers (repeat pool)

const phases = [
  {
    id: "neg1",
    label: "🌱 PHASE -1 — Absolute Basics",
    range: "Day 1–14",
    css: "p-neg1",
    start: 1, end: 14,
    core: [
      "Understand how a computer works (a program = a list of instructions)",
      "Learn what a programming language is; get an intro to C++",
      "Understand the concept of a variable (a box that stores a value)",
      "Understand the concept of Input/Output",
      "Understand logic/conditions (if-then thinking)",
      "Set up an online compiler (replit.com or onlinegdb.com)",
      "Write and run your first 'Hello World' program",
      "Write 2-3 small practice programs using print statements",
      "Mindset session — understand that struggling at the start is normal",
      "Do a full revision of Phase -1",
      "Clear any doubts (re-read wherever you got stuck)",
      "Write 5 small practice programs (print + basic logic)",
      "Buffer/Revision day — complete anything you missed",
      "Phase -1 completion check — everything clear? Ready to start Phase 0"
    ],
    weekendOverride: false
  },
  {
    id: "p0",
    label: "🚀 PHASE 0 — Foundation (C++ + Basic Maths)",
    range: "Day 15–60 (Month 1-2)",
    css: "p0",
    start: 15, end: 60,
    core: [
      "C++ syntax basics: variables, data types",
      "Input/Output (cin/cout), fast I/O",
      "Loops: for loop practice",
      "Loops: while & do-while practice",
      "Conditionals: if-else, switch case",
      "Arrays basics + practice problems",
      "Strings basics + practice problems",
      "Functions: intro and practice",
      "Pointers & references (pay close attention, important topic)",
      "STL: vector practice",
      "STL: pair, map, set practice",
      "sort() and custom comparator practice",
      "Time Complexity: understand Big O notation",
      "Maths: GCD/LCM, divisibility rules",
      "Maths: Prime numbers + Sieve of Eratosthenes",
      "Maths: Modular arithmetic basics"
    ],
    fillers: [
      "Practice: solve 3-4 problems on C++ basics",
      "Revision: review any topic that felt weak",
      "Practice: solve 3 array/string problems",
      "Revision: review STL (vector/map/set) commands"
    ]
  },
  {
    id: "p1",
    label: "⚙️ PHASE 1 — DSA Foundation",
    range: "Day 61–120 (Month 2-4)",
    css: "p1",
    start: 61, end: 120,
    core: [
      "Arrays & Strings: 2 pointer technique",
      "Arrays & Strings: sliding window technique",
      "Recursion basics + practice",
      "Backtracking basics + practice",
      "Sorting: understand and implement merge sort",
      "Sorting: understand and implement quick sort",
      "Binary Search: standard implementation",
      "Binary Search: 'search on answer' pattern",
      "Linked List basics + operations",
      "Stack: implementation + problems",
      "Queue: implementation + problems",
      "Create a Codeforces account and set up your profile",
      "Maths: Combinatorics — nCr, factorial, permutations",
      "Maths: Basic Probability concepts"
    ],
    fillers: [
      "Do a Codeforces Div 3/4 contest (or virtual)",
      "Upsolving: try unsolved problems from the previous contest",
      "Practice: 3-4 DSA problems (recursion/sorting/searching)",
      "Revision: review recursion + backtracking"
    ]
  },
  {
    id: "p2",
    label: "🔥 PHASE 2 — Intermediate DSA + CP",
    range: "Day 121–210 (Month 4-7)",
    css: "p2",
    start: 121, end: 210,
    core: [
      "Binary Tree & tree traversals (inorder/preorder/postorder)",
      "BST: insert, search, delete",
      "Graph representation (adjacency list/matrix)",
      "BFS implementation + problems",
      "DFS implementation + problems",
      "Dijkstra's algorithm",
      "Bellman-Ford algorithm",
      "Union-Find (DSU) implementation",
      "MST: Kruskal's algorithm",
      "MST: Prim's algorithm",
      "Maths: Graph theory basics (degree, connected components)",
      "DP: 1D DP (Fibonacci, climbing stairs)",
      "DP: 2D DP (0/1 Knapsack)",
      "DP: LCS & LIS problems",
      "DP: subsets/bitmask DP",
      "DP: DP on trees/graphs",
      "Maths: Combinatorics advanced",
      "Attempt a Codeforces Div 2 contest"
    ],
    fillers: [
      "Do a Codeforces contest (Div 2/3)",
      "Upsolving: try unsolved problems from the contest",
      "Practice: 3-4 Graph/Tree problems",
      "Practice: 3-4 DP problems",
      "Revision: review weak DP patterns"
    ]
  },
  {
    id: "p3",
    label: "⚡ PHASE 3 — Advanced Topics",
    range: "Day 211–300 (Month 7-10)",
    css: "p3",
    start: 211, end: 300,
    core: [
      "Maths: Modular inverse & Fermat's little theorem",
      "Maths: Euler's totient function",
      "Maths: Extended Euclidean algorithm",
      "Maths: Catalan numbers",
      "Maths: Inclusion-exclusion principle",
      "Maths: Matrix exponentiation",
      "Maths: Probability & Expected Value",
      "Segment Tree: concept + implementation",
      "Fenwick Tree / BIT: concept + implementation",
      "Trie: concept + implementation",
      "Sparse Table: concept + implementation",
      "Topological Sort",
      "SCC: Tarjan's algorithm",
      "SCC: Kosaraju's algorithm",
      "Floyd-Warshall algorithm",
      "LCA (Lowest Common Ancestor)",
      "KMP algorithm",
      "Z-algorithm",
      "String Hashing"
    ],
    fillers: [
      "Do a Codeforces contest",
      "Upsolving: try unsolved problems from the contest",
      "Practice: 3-4 advanced DS problems",
      "Practice: 3-4 advanced graph problems",
      "Revision: review advanced maths topics"
    ]
  },
  {
    id: "p4",
    label: "🏆 PHASE 4 — ICPC Specific Prep (Regionals)",
    range: "Day 301–420 (Month 10-14)",
    css: "p4",
    start: 301, end: 420,
    core: [
      "Decide on your team (3 members) — discuss and confirm commitment",
      "Understand the ICPC format (1 machine, 3 people, 5 hours, penalty rules)",
      "Divide roles — maths person, implementation person, DS/graph person",
      "Set up a team communication strategy (who codes first)",
      "Codeforces Gym: solve an old ICPC regional set #1",
      "Codeforces Gym: solve an old ICPC regional set #2",
      "Start practicing on Kattis",
      "Do weekly team contest #1",
      "Fast implementation practice (focus on speed)",
      "Debugging: learn stress testing setup and try it",
      "Practice reading editorials (learn from what you couldn't solve)",
      "Do weekly team contest #2",
      "Speed round practice — timed problem solving",
      "Mock regional — full 5-hour simulation with your team"
    ],
    fillers: [
      "Team practice: solve 1 ICPC set from the Gym",
      "Do a weekly team contest",
      "Individual upsolving + weak topic revision",
      "Read editorials + make notes",
      "Mock contest (solo or team) — focus on speed"
    ]
  }
];

// ---------- DAY GENERATION ----------
function buildDays(phase) {
  const days = [];
  let coreIdx = 0;
  let fillerIdx = 0;
  for (let d = phase.start; d <= phase.end; d++) {
    const weekdayIdx = (d - 1) % 7; // 0=Mon ... 5=Sat, 6=Sun
    const isWeekend = weekdayIdx === 5 || weekdayIdx === 6;
    let text;
    if (isWeekend) {
      if (weekdayIdx === 5) {
        text = "CP Contest / Team Practice (weekend session)";
      } else {
        text = d >= 180
          ? "Upsolving + Revision + Internship prep (resume/outreach/project)"
          : "Upsolving + Revision (review of previous problems)";
      }
    } else {
      if (coreIdx < phase.core.length) {
        text = phase.core[coreIdx];
        coreIdx++;
      } else {
        text = phase.fillers[fillerIdx % phase.fillers.length];
        fillerIdx++;
      }
    }
    days.push({ day: d, text, weekend: isWeekend });
  }
  return days;
}

// ---------- STORAGE ----------
let progressState = {};
const STORAGE_KEY = "icpc-tracker-progress";
const hasCloudStorage = (typeof window.storage !== "undefined" && window.storage !== null);

async function loadProgress() {
  // Try cloud storage first (works inside Claude.ai)
  if (hasCloudStorage) {
    try {
      const res = await window.storage.get(STORAGE_KEY, false);
      if (res && res.value) {
        progressState = JSON.parse(res.value);
        return;
      }
    } catch (e) {
      // key may not exist yet, fall through to local
    }
  }
  // Fallback: browser's own localStorage (works when file opened standalone)
  try {
    const local = localStorage.getItem(STORAGE_KEY);
    if (local) progressState = JSON.parse(local);
  } catch (e) {
    progressState = {};
  }
}

let saveTimeout = null;
function saveProgress() {
  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(async () => {
    let savedSomewhere = false;
    if (hasCloudStorage) {
      try {
        await window.storage.set(STORAGE_KEY, JSON.stringify(progressState), false);
        savedSomewhere = true;
      } catch (e) { /* fall through to local */ }
    }
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(progressState));
      savedSomewhere = true;
    } catch (e) { /* ignore */ }

    document.getElementById("status").textContent = savedSomewhere ? "✓ Saved" : "⚠ Save failed";
    setTimeout(() => { document.getElementById("status").textContent = ""; }, 1200);
  }, 300);
}

// ---------- RENDER ----------
let totalDays = 0;

function render() {
  const container = document.getElementById("phases-container");
  container.innerHTML = "";
  totalDays = 0;

  phases.forEach(phase => {
    const days = buildDays(phase);
    totalDays += days.length;
    const phaseDone = days.filter(d => progressState[d.day]).length;

    const details = document.createElement("details");
    details.className = "phase " + phase.css;

    const summary = document.createElement("summary");
    summary.innerHTML = `
      <span class="summary-left"><span class="chevron">▶</span> ${phase.label}</span>
      <span class="summary-right"><span>${phase.range}</span><span class="sr-count">${phaseDone}/${days.length} done</span></span>
    `;
    details.appendChild(summary);

    const body = document.createElement("div");
    body.className = "phase-body";

    days.forEach(dayObj => {
      const row = document.createElement("div");
      row.className = "day-row" + (dayObj.weekend ? " weekend" : "") + (progressState[dayObj.day] ? " done" : "");

      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.checked = !!progressState[dayObj.day];
      checkbox.addEventListener("change", () => {
        progressState[dayObj.day] = checkbox.checked;
        row.classList.toggle("done", checkbox.checked);
        saveProgress();
        updateProgressBar();
        render(); // refresh per-phase counts
        // keep the phase the user was in open
        const idx = phases.indexOf(phase);
        const el = document.querySelectorAll("details.phase")[idx];
        if (el) el.open = true;
      });

      const labelWrap = document.createElement("div");
      labelWrap.className = "day-label";
      const numSpan = document.createElement("span");
      numSpan.className = "day-num" + (dayObj.weekend ? " weekend-tag" : "");
      numSpan.textContent = "DAY " + dayObj.day + (dayObj.weekend ? " · WEEKEND" : "");
      const textSpan = document.createElement("span");
      textSpan.className = "day-text";
      textSpan.textContent = dayObj.text;

      labelWrap.appendChild(numSpan);
      labelWrap.appendChild(textSpan);

      row.appendChild(checkbox);
      row.appendChild(labelWrap);
      body.appendChild(row);
    });

    details.appendChild(body);
    container.appendChild(details);
  });

  document.getElementById("progress-total").textContent = totalDays;
  updateProgressBar();
}

function updateProgressBar() {
  const done = Object.values(progressState).filter(Boolean).length;
  document.getElementById("progress-count").textContent = done;
  const pct = totalDays ? Math.round((done / totalDays) * 100) : 0;
  document.getElementById("progress-pct").textContent = pct + "%";
  document.getElementById("bar").style.width = pct + "%";
}

// ---------- CONTROLS ----------
document.getElementById("expand-all").addEventListener("click", () => {
  document.querySelectorAll("details.phase").forEach(d => d.open = true);
});
document.getElementById("collapse-all").addEventListener("click", () => {
  document.querySelectorAll("details.phase").forEach(d => d.open = false);
});
document.getElementById("reset-btn").addEventListener("click", async () => {
  if (confirm("Reset all progress? This cannot be undone.")) {
    progressState = {};
    if (hasCloudStorage) {
      try { await window.storage.set(STORAGE_KEY, JSON.stringify(progressState), false); } catch(e) {}
    }
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(progressState)); } catch(e) {}
    render();
  }
});

// ---------- INIT ----------
(async function init() {
  document.getElementById("status").textContent = "Loading progress...";
  await loadProgress();
  render();
  document.getElementById("status").textContent = "";
  // open phase -1 by default
  const first = document.querySelector("details.phase");
  if (first) first.open = true;
})();
</script>

</body>
</html>
